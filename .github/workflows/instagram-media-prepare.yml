name: Instagram Temporary Media Prepare

on:
  workflow_dispatch:
    inputs:
      reel_id:
        description: "Exactly one CONTENT_READY Reel ID"
        required: true
        type: string
      provider:
        description: "Temporary media provider"
        required: true
        type: choice
        options:
          - dry-run
          - azure

jobs:
  prepare:
    runs-on: ubuntu-latest
    environment: instagram-production
    permissions:
      contents: read
      id-token: write
    env:
      AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      AZURE_STORAGE_ACCOUNT_NAME: ${{ vars.AZURE_STORAGE_ACCOUNT_NAME }}
      AZURE_STORAGE_CONTAINER_NAME: ${{ vars.AZURE_STORAGE_CONTAINER_NAME }}
      AZURE_STORAGE_SAS_TTL_MINUTES: ${{ vars.AZURE_STORAGE_SAS_TTL_MINUTES }}
      AZURE_STORAGE_BLOB_PREFIX: ${{ vars.AZURE_STORAGE_BLOB_PREFIX }}
      AZURE_STORAGE_ENDPOINT_SUFFIX: ${{ vars.AZURE_STORAGE_ENDPOINT_SUFFIX }}
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Azure federated login
        if: ${{ inputs.provider == 'azure' }}
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Prepare exactly one temporary Reel
        env:
          PILOT_REEL_ID: ${{ inputs.reel_id }}
          MEDIA_PROVIDER: ${{ inputs.provider }}
        run: |
          if [ "$MEDIA_PROVIDER" = "dry-run" ]; then
            npm run instagram:media-prepare -- --reel="$PILOT_REEL_ID" --provider=dry-run --dry-run
          else
            npm run instagram:media-prepare -- --reel="$PILOT_REEL_ID" --provider=azure
          fi
